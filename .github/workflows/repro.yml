name: Fresh-clone reproducibility

on:
  push:
    branches: [codex/dev-review-report]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        id: setup-uv
        with:
          version: '0.9.25'
      - name: Authenticate clone and install the frozen project
        env:
          MACRO_MENU_UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
        run: python3.12 scripts/bootstrap_resume.py --repo-root . --state resume/state.json
      - name: Run full suite and deterministic double build
        run: python scripts/verify_resume.py --repo-root . --state resume/state.json --output-root repro-output
      - name: Select authenticated operator bundle
        id: bundle
        run: python scripts/select_operator_bundle.py --repo-root . --github-output "$GITHUB_OUTPUT" --snapshot-root repro-output/operator-upload --inactive-as-unavailable
      - name: Upload JSON reproducibility receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-reproducibility-receipt
          path: repro-output/reproducibility-receipt.json
          if-no-files-found: error
      - name: Upload fixed-path operator candidate when issued
        if: steps.bundle.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-authenticated-operator-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error

  windows-native-collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc
        id: setup-uv
        with:
          version: '0.9.25'
      - name: Bootstrap, doctor and immutable-ref checks
        shell: cmd
        env:
          MACRO_MENU_UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
        run: |
          "%MACRO_MENU_UV_EXECUTABLE%" -V
          "%MACRO_MENU_UV_EXECUTABLE%" --version
          set "ORIGIN_DEV_BEFORE="
          for /f "delims=" %%I in ('git rev-parse refs/remotes/origin/dev') do set "ORIGIN_DEV_BEFORE=%%I"
          if not defined ORIGIN_DEV_BEFORE exit /b 1
          py -3.12 scripts\bootstrap_resume.py --repo-root . --state resume\state.json || exit /b 1
          .venv\Scripts\macro-menu-build.exe doctor --state resume\state.json --scope development --format json || exit /b 1
          set "ORIGIN_DEV_AFTER="
          for /f "delims=" %%I in ('git rev-parse refs/remotes/origin/dev') do set "ORIGIN_DEV_AFTER=%%I"
          if not defined ORIGIN_DEV_AFTER exit /b 1
          if not "%ORIGIN_DEV_BEFORE%"=="%ORIGIN_DEV_AFTER%" exit /b 1
          set "LOCAL_DEV="
          for /f "delims=" %%I in ('git rev-parse refs/heads/dev') do set "LOCAL_DEV=%%I"
          if not defined LOCAL_DEV exit /b 1
          if not "%LOCAL_DEV%"=="abce8ffe37d25cc8f189ae9e9a2a1e942279a5ad" exit /b 1
      - name: Native collector tests
        shell: cmd
        env:
          MACRO_MENU_UV_EXECUTABLE: ${{ steps.setup-uv.outputs.uv-path }}
        run: '"%MACRO_MENU_UV_EXECUTABLE%" run pytest -q catvba_refactor\tests\test_target_collector_workspace.py catvba_refactor\tests\test_target_collector_records.py catvba_refactor\tests\test_target_collector_finalize.py'
      - name: Build smoke pyz and exercise cmd wrapper
        shell: cmd
        run: |
          mkdir windows-output || exit /b 1
          .venv\Scripts\python.exe scripts\collector_smoke.py --repo-root . --output windows-output\collector-smoke-receipt.json --pyz-output scripts\target-discovery.pyz || exit /b 1
          call scripts\run-discovery.cmd --help || exit /b 1
          .venv\Scripts\python.exe scripts\target-discovery.pyz --help || exit /b 1
      - name: Select authenticated operator bundle
        id: bundle
        shell: cmd
        run: .venv\Scripts\python.exe scripts\select_operator_bundle.py --repo-root . --github-output "%GITHUB_OUTPUT%" --snapshot-root windows-output\operator-upload --inactive-as-unavailable
      - name: Upload Windows collector smoke JSON receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-collector-smoke-receipt
          path: windows-output/collector-smoke-receipt.json
          if-no-files-found: error
      - name: Upload fixed-path operator candidate when issued
        if: steps.bundle.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-authenticated-operator-bundle
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
